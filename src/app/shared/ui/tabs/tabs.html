<div class="flex border-b border-slate-700/50 px-1 overflow-x-auto">
  @for (tab of tabs(); track tab.id) {
    <button type="button" (click)="onTabClick(tab.id)"
      class="px-4 py-3 text-sm font-medium border-b-2 -mb-px transition-colors flex items-center gap-2 cursor-pointer shrink-0 select-none"
      [class.border-primary]="activeTab() === tab.id"
      [class.text-primary]="activeTab() === tab.id"
      [class.border-transparent]="activeTab() !== tab.id"
      [class.text-slate-400]="activeTab() !== tab.id"
      [class.hover:text-slate-200]="activeTab() !== tab.id">

      @if (tab.icon) {
        <span class="material-symbols-outlined text-[18px]">{{ tab.icon }}</span>
      }
      <span>{{ tab.label }}</span>
      @if (tab.count !== undefined && tab.count !== null) {
        <span class="ml-0.5 px-1.5 py-0.5 text-xs font-bold rounded-md transition-colors"
              [class.bg-primary/15]="activeTab() === tab.id"
              [class.text-primary]="activeTab() === tab.id"
              [class.bg-slate-800]="activeTab() !== tab.id"
              [class.text-slate-400]="activeTab() !== tab.id">{{ tab.count }}</span>
      }
    </button>
  }
</div>
