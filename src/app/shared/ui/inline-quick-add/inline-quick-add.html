<!-- Header Row: projected slot + toggle button -->
<div class="flex items-center justify-between border-b border-slate-700/50 pb-4 gap-4">
  <ng-content select="[header]"></ng-content>

  <button type="button" (click)="onToggle()"
    class="h-10 px-4 rounded-lg text-sm font-medium text-white bg-primary hover:bg-primary/90 transition-colors cursor-pointer shadow-lg shadow-primary/20 flex justify-center items-center gap-2 shrink-0">
    <span class="material-symbols-outlined text-lg transition-transform duration-300"
          [class.rotate-45]="open()">{{ icon() }}</span>
    <span>{{ label() }}</span>
  </button>
</div>

<!-- Expandable input area -->
<div class="overflow-hidden transition-all duration-300 ease-out"
     [class.max-h-0]="!open()"
     [class.max-h-24]="open()"
     [class.opacity-0]="!open()"
     [class.opacity-100]="open()">

  <div class="pt-4 pb-2 relative">
    <!-- Projected input/select -->
    <ng-content></ng-content>

    <!-- Submit micro-button -->
    <button type="button" (click)="onSubmit()" [disabled]="submitDisabled()"
      class="absolute right-1.5 top-1/2 -translate-y-1/2 mt-1 h-8 w-10 rounded-md flex items-center justify-center text-primary hover:bg-primary hover:text-white transition-colors cursor-pointer disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-primary disabled:cursor-not-allowed">
      @if (isSubmitting()) {
        <app-spinner size="sm" />
      } @else {
        <span class="material-symbols-outlined text-lg">arrow_upward</span>
      }
    </button>
  </div>
</div>
